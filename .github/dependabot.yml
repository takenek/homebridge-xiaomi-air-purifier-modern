version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # vitest and @vitest/coverage-v8 must be bumped together. coverage-v8
      # declares an EXACT peer on vitest (`"vitest": "5.0.0"`, not a range), so a
      # split bump leaves the tree unresolvable: `npm ci` dies with ERESOLVE
      # before lint/typecheck/test run, and every job in ci.yml and
      # supply-chain.yml fails. Dependabot opened #264 and #265 as two separate,
      # permanently red PRs for exactly this reason, and they had to be merged by
      # hand as one integration branch (#267). Grouping them yields one
      # mergeable PR instead. Dependencies matching no group keep getting their
      # own PR, so biome/typescript/homebridge are unaffected.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # @types/node must track the lowest supported Node.js runtime, not the
      # latest release line. engines.node is "^22.12.0 || ^24.0.0", so the types
      # stay pinned to ^22.x; a major bump (e.g. 25.x) would type-check against
      # APIs absent from Node 22/24 and let runtime breakage pass CI.
      # See docs/audit-report.md. Patch/minor updates within 22.x are allowed.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
