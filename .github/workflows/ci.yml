name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each lane tests against the lowest Homebridge release that supports
        # that Node.js line: 2.0.2 (the peerDependency floor) on Node 22/24, and
        # 2.3.0 on Node 26 - Homebridge 2.0.x-2.2.x declare engines.node
        # "^22 || ^24", so engine-strict refuses to install them on Node 26.
        include:
          - node: 22
            homebridge: 2.0.2
            lane: full
          - node: 24
            homebridge: 2.0.2
            lane: full
          - node: 26
            homebridge: 2.3.0
            lane: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save homebridge@${{ matrix.homebridge }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Upload coverage
        if: always() && matrix.lane == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}-lane-${{ matrix.lane }}
          path: coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
