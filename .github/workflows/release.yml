name: Release

on:
  push:
    branches: [main]

# A-02: no workflow-wide permissions. Each job requests only what it needs
# (least privilege). The privileged OIDC/write token exists solely in `publish`.
permissions: {}

jobs:
  # A-02: read-only verification gate. Runs the full check matrix (Node 22/24/26)
  # for the exact commit being released, decoupled from the privileged publish
  # step. `publish` depends on this, so a commit that fails lint/typecheck/test/
  # build/audit on any supported Node version is never published.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A-02: do not persist the checkout token in .git/config; nothing in
          # this job needs to push, and code runs (npm run check) before publish.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  # A-02: minimal publish job. It only gains the write/OIDC scopes after `verify`
  # succeeds on every matrix cell. semantic-release core is resolved by the
  # pinned action. The plugins are exact-pinned below, but their transitive
  # dependencies are not (see the note above extra_plugins).
  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    # A-02: attach a protected GitHub Environment. Configure required reviewers /
    # required status checks (CI, Supply Chain) on the `release` environment in
    # repository settings so publication is additionally gated by branch
    # protection outcomes for the same commit.
    environment: release
    permissions:
      # semantic-release: create tags, releases and the changelog commit.
      contents: write
      # @semantic-release/github: comment on issues/PRs.
      issues: write
      pull-requests: write
      # npm Trusted Publishing via OIDC.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A-02: semantic-release authenticates via GITHUB_TOKEN below; it does
          # not use the checkout-persisted credential.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - run: npm ci

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          # NOTE (A-02 residual): pinned to a major range because the action
          # resolves semantic-release core at run time. Fully deterministic
          # release tooling (exact-pinned core + locked plugin tree, or an
          # immutable release image) is an operator follow-up — see
          # STAGE_5_REMEDIATION_IMPLEMENTATION.md.
          semantic_version: 25
          # The plugins below are exact-pinned, but a pin only takes effect if it
          # satisfies semantic-release core's own dependency range (core 25.0.9:
          # github ^12.0.0, release-notes-generator ^14.1.0, npm ^13.1.1,
          # commit-analyzer ^13.0.1). Otherwise npm nests core's own copy under
          # node_modules/semantic-release/node_modules, core loads that copy first,
          # and the pin is silently ignored (github@11.0.4 and
          # release-notes-generator@14.0.3 were ignored this way). changelog and
          # git are not core dependencies, so their pins always apply. Dependabot
          # does not see these pins, so recheck them when bumping the action.
          # undici@7.30.1 is not a plugin. Without it, @semantic-release/github
          # would use the undici 7.25.0 locked in the action's package-lock.json,
          # which has known advisories (7.30.1 is the first clean 7.x). Drop it once
          # the action's lockfile ships undici >= 7.30.1.
          # The action splits this block on whitespace and installs every token,
          # so never put comments inside it.
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
            @semantic-release/npm@13.2.0
            @semantic-release/github@12.0.10
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            undici@7.30.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
